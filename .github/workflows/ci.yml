name: CI
on:
  push:
  pull_request:
jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          GVF=$(cat .godot-version); GV=${GVF%-*}; GF=${GVF#*-}
          # GitHub release mirror first (the website download endpoint rejects CI runners), website as fallback.
          fetch() {
            curl -fsSL -o "$2" "https://github.com/godotengine/godot-builds/releases/download/$GVF/Godot_v${GVF}_$1" \
              || curl -fsSL -A "Mozilla/5.0" -o "$2" "https://downloads.godotengine.org/?version=$GV&flavor=$GF&slug=$1&platform=$3"
          }
          fetch linux.x86_64.zip godot.zip linux.64
          unzip -q godot.zip
          sudo mv Godot_v${GVF}_linux.x86_64 /usr/local/bin/godot
          fetch export_templates.tpz tpl.tpz templates
          mkdir -p ~/.local/share/godot/export_templates/$GV.$GF
          unzip -q -j tpl.tpz 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' 'templates/macos.zip' -d ~/.local/share/godot/export_templates/$GV.$GF
          godot --version
      - name: Import
        run: godot --headless --path . --import || true
      - name: Lint
        run: tools/lint.py
      - name: Tests
        run: tools/test.sh
      - name: Network smoke test
        run: tools/test_net.sh
      - name: Export Linux, Windows, and macOS
        run: |
          mkdir -p build/linux build/windows build/macos
          godot --headless --path . --export-release "Linux" build/linux/sea_of_scoundrels.x86_64
          godot --headless --path . --export-release "Windows Desktop" build/windows/sea_of_scoundrels.exe
          godot --headless --path . --export-release "macOS" build/macos/sea_of_scoundrels.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sea-of-scoundrels-linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: sea-of-scoundrels-windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: sea-of-scoundrels-macos
          path: build/macos
